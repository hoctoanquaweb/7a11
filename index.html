<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Kiểm Tra Trắc Nghiệm</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 700px; margin: 25px auto; padding: 22px; border: 1px solid #cbd5e1; border-radius: 14px; background-color: #f8fafc; box-shadow: 0 4px 16px rgba(0,0,0,0.08); color: #1e293b; }
        h2 { text-align: center; color: #4f46e5; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #64748b; font-size: 0.95rem; margin-bottom: 20px; }
        .options { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        button { display: block; width: 100%; padding: 12px 14px; font-size: 16px; cursor: pointer; text-align: left; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; transition: 0.2s; }
        button:hover:not(:disabled) { background-color: #f1f5f9; border-color: #4f46e5; }
        #message { margin-top: 15px; font-weight: bold; font-size: 1.05rem; line-height: 1.45; }
        #status { font-size: 14px; color: #4338ca; background: #eef2ff; padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background: #fff; }
        .btn-start { background-color: #4f46e5; color: white; text-align: center; font-weight: bold; margin-top: 15px; border: none; border-radius: 8px; padding: 12px; cursor: pointer; width: 100%; }
        .btn-start:hover { background-color: #4338ca; }
        .btn-action { background-color: #10b981; color: white; border: none; border-radius: 6px; padding: 10px 15px; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; width: auto; display: inline-block; }
        .btn-action:hover { background-color: #059669; }
        .btn-danger { background-color: #dc2626; color: white; border: none; border-radius: 6px; padding: 10px 15px; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; width: auto; display: inline-block; }
        .btn-danger:hover { background-color: #b91c1c; }
        .result-card { background: #fff; padding: 25px; border-radius: 10px; border: 2px solid #10b981; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .result-card h3 { color: #10b981; margin-top: 0; }
        .history-box { background: #fff; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; margin-top: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }
        th { background-color: #f1f5f9; color: #334155; }
        .lock-card { background: #ffffff; padding: 25px; border-radius: 10px; border: 2px dashed #6366f1; text-align: center; margin-bottom: 20px; }
        .info-badge { background: #eef2ff; color: #4338ca; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-bottom: 15px; text-align: center; border: 1px solid #c7d2fe; line-height: 1.5; }
        #question-image-box { text-align: center; margin: 12px 0 16px; padding: 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; }
        #question-image-box img { max-width: 100%; max-height: 240px; border-radius: 6px; }
    </style>
</head>
<body>
    <h2>Bài Kiểm Tra Trắc Nghiệm 📝</h2>
    <p class="subtitle">GV Mai Trọng Khang - THCS Cần Đăng, Tỉnh An Giang</p>

    <div id="password-screen" class="lock-card" style="display: none;">
        <h3 style="color: #4f46e5; margin-top: 0;">🔒 Phòng thi yêu cầu mật khẩu</h3>
        <p style="color: #64748b; font-size: 14px;">Vui lòng nhập mật khẩu do giáo viên cung cấp để mở đề thi:</p>
        <div class="form-group" style="max-width: 300px; margin: 0 auto;">
            <input type="password" id="input-password" placeholder="Nhập mật khẩu tại đây..." style="text-align: center; font-size: 16px;">
        </div>
        <button type="button" class="btn-start" onclick="unlockQuiz()" style="max-width: 300px; margin: 10px auto 0 auto;">🔓 Xác nhận &amp; Vào bài thi</button>
        <p id="pw-error" style="color: red; font-size: 14px; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <div id="login-container" style="display: none;">
        <p style="text-align: center; color: #555;">Học sinh nhập đầy đủ họ tên và lớp để bắt đầu làm bài.</p>
        
        <div id="limit-info-display" class="info-badge"></div>

        <div class="form-group">
            <label for="student-name">Họ và tên học sinh:</label>
            <input type="text" id="student-name" placeholder="Ví dụ: Nguyễn Văn A">
        </div>
        <div class="form-group">
            <label for="student-class">Lớp:</label>
            <input type="text" id="student-class" placeholder="Ví dụ: 7A1">
        </div>

        <button type="button" class="btn-start" onclick="startQuiz()">🚀 Bắt đầu làm bài</button>
        <p id="login-error" style="color: red; text-align: center; font-size: 14px; margin-top: 10px; font-weight: bold;"></p>

        <div class="history-box">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px;">
                <h4 style="margin: 0; color: #334155;">📊 Lịch sử làm bài trên máy này:</h4>
                <div>
                    <button class="btn-action" style="font-size: 0.85rem; padding: 6px 12px; margin-top:0;" onclick="exportScoresToExcel()">📥 Tải Excel</button>
                    <button class="btn-danger" style="font-size: 0.85rem; padding: 6px 12px; margin-top:0; margin-left: 5px;" onclick="clearHistory()">🗑️ Xóa lịch sử</button>
                </div>
            </div>
            <div id="history-table-wrapper" style="max-height: 180px; overflow-y: auto; margin-top: 10px;"></div>
        </div>
    </div>

    <div id="quiz-wrapper" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; background: #eef2ff; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px;">
            <span id="student-info-display"></span>
            <span id="timer-display" style="font-weight: bold; color: #dc2626;">⏱️ Thời gian: 15:00</span>
        </div>
        
        <div id="status"></div>
        <div id="quiz-container">
            <p id="question-text" style="font-size: 18px; font-weight: bold; line-height: 1.45;"></p>
            <div id="question-image-box" style="display: none;">
                <img id="question-image" src="" alt="Hình minh họa">
            </div>
            <div id="options-container" class="options"></div>
        </div>
        <div id="message"></div>
    </div>

    <script>
        const questionBank = {"easy":[{"q":"Theo định nghĩa thì: Hai tam giác bằng nhau là hai tam giác có:","a":["Các cạnh tương ứng bằng nhau và các góc tương ứng bằng nhau.","Chỉ cần ba cạnh tương ứng bằng nhau.","Chỉ cần ba góc tương ứng bằng nhau.","Diện tích bằng nhau."],"correct":0,"explanation":"Theo định nghĩa, hai tam giác bằng nhau là hai tam giác có các cạnh tương ứng bằng nhau và các góc tương ứng bằng nhau.","image":""},{"q":"Khi kí hiệu hai tam giác bằng nhau, các chữ cái chỉ tên các đỉnh tương ứng được viết như thế nào?","a":["Viết theo thứ tự tùy ý.","Viết theo đúng thứ tự đỉnh tương ứng.","Viết theo thứ tự bảng chữ cái.","Viết ngược thứ tự nhau."],"correct":1,"explanation":"Quy ước khi viết kí hiệu hai tam giác bằng nhau, các chữ cái chỉ tên các đỉnh tương ứng phải được viết theo cùng thứ tự.","image":""},{"q":"Cho ΔABC = ΔMNP. Cạnh tương ứng với cạnh AB là:","a":["Cạnh NP","Cạnh MP","Cạnh MN","Cạnh PN"],"correct":2,"explanation":"Từ kí hiệu ΔABC = ΔMNP, hai đỉnh đầu tiên tương ứng là A với M, B với N nên cạnh tương ứng với AB là MN.","image":""},{"q":"Cho ΔABC = ΔMNP. Góc tương ứng với góc C là:","a":["Góc M","Góc N","Góc P","Góc A"],"correct":2,"explanation":"Đỉnh thứ ba của ΔABC là C tương ứng với đỉnh thứ ba của ΔMNP là P, nên góc tương ứng với góc C là góc P.","image":""},{"q":"Cho ΔDEF = ΔHKI. Khẳng định nào sau đây là đúng?","a":["DE = KI","EF = KI","DF = HK","∠D = ∠K"],"correct":1,"explanation":"Từ thứ tự đỉnh tương ứng D-H, E-K, F-I ta có EF = KI.","image":""},{"q":"Cho ΔABC = ΔDEF biết AB = 5 cm. Độ dài cạnh DE bằng bao nhiêu?","a":["10 cm","2,5 cm","5 cm","15 cm"],"correct":2,"explanation":"Vì ΔABC = ΔDEF nên hai cạnh tương ứng bằng nhau: DE = AB = 5 cm.","image":""},{"q":"Cho ΔABC = ΔPQR biết ∠B = 65°. Số đo góc Q bằng bao nhiêu?","a":["25°","115°","65°","90°"],"correct":2,"explanation":"Vì ΔABC = ΔPQR nên hai góc tương ứng bằng nhau: ∠Q = ∠B = 65°.","image":""},{"q":"Phát biểu nào sau đây đúng về trường hợp bằng nhau thứ nhất của tam giác (cạnh - cạnh - cạnh)?","a":["Nếu ba cạnh của tam giác này bằng ba cạnh của tam giác kia thì hai tam giác đó bằng nhau.","Nếu ba góc của tam giác này bằng ba góc của tam giác kia thì hai tam giác đó bằng nhau.","Nếu hai cạnh của tam giác này bằng hai cạnh của tam giác kia thì hai tam giác đó bằng nhau.","Nếu chu vi hai tam giác bằng nhau thì hai tam giác đó bằng nhau."],"correct":0,"explanation":"Định lí (c.c.c): Nếu ba cạnh của tam giác này bằng ba cạnh của tam giác kia thì hai tam giác đó bằng nhau.","image":""},{"q":"Để hai tam giác ABC và DEF bằng nhau theo trường hợp cạnh - cạnh - cạnh (c.c.c) thì cần có điều kiện nào sau đây?","a":["AB = DE, BC = EF, AC = DF","∠A = ∠D, ∠B = ∠E, ∠C = ∠F","AB = DE, BC = EF, ∠B = ∠E","AB = EF, BC = FD, AC = DE"],"correct":0,"explanation":"Ba cặp cạnh tương ứng bằng nhau là AB = DE, BC = EF và AC = DF.","image":""},{"q":"Quan sát Hình 1, hãy chọn cách viết kí hiệu bằng nhau đúng của hai tam giác:","a":["ΔABC = ΔDFE","ΔABC = ΔDEF","ΔABC = ΔEDF","ΔABC = ΔFED"],"correct":1,"explanation":"Dựa vào kí hiệu các cạnh bằng nhau trên Hình 1: AB = DE, BC = EF, AC = DF nên ΔABC = ΔDEF.","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfcAAAEvCAYAAABYGIhlAAAAOXRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjYuMCwgaHR0cHM6Ly9tYXRwbG90bGliLm9yZy89olMNAAAACXBIWXMAABcSAAAXEgFnn9JSAAA6/ElEQVR4nO3dd1hUZ/YH8O8wdJCmiAUrYO8VBbGiQVPX9Jiom8T8kmgSo9lNojHR4DY1asruajYrJjHdmGSNDUUFVMTeoyIiIKKA9F7m98euMu8dRinDvDN3vp/n8Xni4d7hGBnPnXPfe16NTqfTgYiIiFTDTnYCREREZFos7kRERCrD4k5ERKQyLO5EREQqw+JORESkMizuREREKsPiTkREpDIs7kRERCrD4k5ERKQyLO5EREQqw+JORESkMizuREREKsPiTkREpDIs7kRERCrD4k5ERKQyLO5EREQqw+JORESkMizuREREKsPiTkREpDIs7kRERCrD4k5ERKQyLO5EREQqw+JORESkMizuREREKsPiTkREpDIs7kRERCrD4k5ERKQyLO5EREQqw+JORESkMizuREREKsPiTkREpDIs7kRERCrD4k5ERKQyLO5EREQqw+JORESkMizuREREKsPiTkREpDIs7kRERCrD4k5ERKQyLO5EREQqw+JORESkMizuREREKsPiTkREpDIs7kRERCrD4k5ERKQyLO5EREQqw+JORESkMizuREREKsPiTkREpDIs7lbq8OHD0Gg00Gg0OH78uOx0iKiBoqKibr+Hb/1yd3dHjx498MQTT2DHjh3Q6XSy0yQrZS87AWqcdevW3f7vqK         let studentName = "";
        let studentClass = "";
        let currentDifficulty = CFG.startDifficulty || "medium"; 
        let correctStreak = 0; 
        let wrongStreak = 0;   
        let questionCount = 0;
        let maxQuestions = 10;
        let correctCount = 0;
        let currentQuestion = null;
        let usedQuestions = new Set();
        let matrixQueue = [];

        let timeLeft = CFG.timeSeconds; 
        let timerInterval = null;

        window.onload = function() {
            const infoTag = document.getElementById("limit-info-display");
            const startLvlNames = { easy: "Dễ (Nhận biết)", medium: "Trung bình (Thông hiểu)", hard: "Khó (Vận dụng)" };
            let modeTxt = CFG.mode === "matrix"
                ? ("📋 Cấu trúc đề: <b>" + CFG.matrix.easy + " Nhận biết - " + CFG.matrix.medium + " Thông hiểu - " + CFG.matrix.hard + " Vận dụng</b>")
                : ("🎯 Chế độ: <b>Trắc nghiệm thích ứng (" + CFG.adaptiveTotal + " câu - Khởi đầu: " + (startLvlNames[CFG.startDifficulty] || "Trung bình") + ")</b>");
            let limTxt = CFG.attemptLimit > 0
                ? ("Giới hạn làm bài tối đa: <b>" + CFG.attemptLimit + " lần</b>")
                : ("Cho phép làm <b>Không giới hạn số lần</b>");

            infoTag.innerHTML = modeTxt + "<br>⏳ Thời gian: <b>" + Math.round(CFG.timeSeconds / 60) + " phút</b> | 📌 " + limTxt;

            if (CFG.password && CFG.password.trim() !== "") {
                document.getElementById("password-screen").style.display = "block";
            } else {
                document.getElementById("login-container").style.display = "block";
            }
            renderHistoryTable();
        };

        function unlockQuiz() {
            const inputPass = document.getElementById("input-password").value;
            const errorTag = document.getElementById("pw-error");
            if (inputPass === CFG.password) {
                document.getElementById("password-screen").style.display = "none";
                document.getElementById("login-container").style.display = "block";
            } else {
                errorTag.innerText = "❌ Mật khẩu chưa chính xác! Vui lòng thử lại.";
            }
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            const nameInput = document.getElementById("student-name").value.trim();
            const classInput = document.getElementById("student-class").value.trim();
            const errorTag = document.getElementById("login-error");

            if (nameInput === "" || classInput === "") {
                errorTag.innerText = "Vui lòng nhập đầy đủ Họ tên và Lớp!";
                return;
            }

            if (CFG.attemptLimit > 0) {
                let history = JSON.parse(localStorage.getItem("quiz_results") || "[]");
                let studentAttempts = history.filter(item => item["Mã đề"] === CFG.examId && item["Họ và tên"] === nameInput && item["Lớp"] === classInput).length;
                if (studentAttempts >= CFG.attemptLimit) {
                    errorTag.innerText = "Em đã làm bài này đủ số lần cho phép (" + studentAttempts + "/" + CFG.attemptLimit + " lần)! Không thể làm thêm.";
                    return;
                }
            }

            studentName = nameInput;
            studentClass = classInput;
            questionCount = 0;
            correctCount = 0;
            correctStreak = 0;
            wrongStreak = 0;
            currentDifficulty = CFG.startDifficulty || "medium";
            usedQuestions.clear();

            if (CFG.mode === "matrix") {
                const eList = shuffleArray(questionBank.easy).slice(0, CFG.matrix.easy).map(x => ({ ...x, lvlLabel: "Nhận biết" }));
                const mList = shuffleArray(questionBank.medium).slice(0, CFG.matrix.medium).map(x => ({ ...x, lvlLabel: "Thông hiểu" }));
                const hList = shuffleArray(questionBank.hard).slice(0, CFG.matrix.hard).map(x => ({ ...x, lvlLabel: "Vận dụng" }));
                matrixQueue = [...eList, ...mList, ...hList];
                maxQuestions = matrixQueue.length;
            } else {
                maxQuestions = CFG.adaptiveTotal;
            }

            document.getElementById("login-container").style.display = "none";
            document.getElementById("quiz-wrapper").style.display = "block";
            document.getElementById("student-info-display").innerHTML = "Học sinh: <b>" + studentName + "</b> | Lớp: <b>" + studentClass + "</b>";

            loadQuestion();
            startTimer();
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("⏰ Đã hết thời gian làm bài!");
                    showFinalResult();
                    return;
                }
                timeLeft--;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            let formattedTime = (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
            const timerEl = document.getElementById("timer-display");
            if (timerEl) {
                timerEl.innerText = "⏱️ Thời gian còn lại: " + formattedTime;
            }
        }

        function getAdaptiveQuestion(difficulty) {
            let list = questionBank[difficulty] || questionBank["medium"];
            let available = list.filter(q => !usedQuestions.has(q.q));
            if (available.length === 0) available = list;
            const randomIndex = Math.floor(Math.random() * available.length);
            const chosenQ = available[randomIndex];
            usedQuestions.add(chosenQ.q);
            const lblMap = { easy: "Nhận biết (Easy)", medium: "Thông hiểu (Medium)", hard: "Vận dụng (Difficult)" };
            return { ...chosenQ, lvlLabel: lblMap[difficulty] || "Thông hiểu" };
        }

        function loadQuestion() {
            if (questionCount >= maxQuestions) {
                showFinalResult();
                return;
            }
            let rawQ = (CFG.mode === "matrix") ? matrixQueue[questionCount] : getAdaptiveQuestion(currentDifficulty);
            questionCount++;

            let originalOptions = rawQ.a.map((text, idx) => ({ text: text, isCorrect: idx === rawQ.correct }));
            let shuffledOptions = shuffleArray(originalOptions);
            let newCorrectIndex = shuffledOptions.findIndex(item => item.isCorrect);

            currentQuestion = {
                q: rawQ.q,
                a: shuffledOptions.map(item => item.text),
                correct: newCorrectIndex,
                explanation: rawQ.explanation,
                image: rawQ.image || "",
                lvlLabel: rawQ.lvlLabel
            };

            document.getElementById("status").innerText = "Câu số: " + questionCount + "/" + maxQuestions + " | Mức độ: " + currentQuestion.lvlLabel;
            document.getElementById("question-text").innerText = "Câu " + questionCount + ": " + currentQuestion.q;

            const imgBox = document.getElementById("question-image-box");
            const imgEl = document.getElementById("question-image");
            if (currentQuestion.image && currentQuestion.image.trim() !== "") {
                imgEl.src = currentQuestion.image;
                imgBox.style.display = "block";
            } else {
                imgEl.src = "";
                imgBox.style.display = "none";
            }

            const optionsDiv = document.getElementById("options-container");
            optionsDiv.innerHTML = "";
            currentQuestion.a.forEach((option, index) => {
                const btn = document.createElement("button");
                const prefixLabel = ["A. ", "B. ", "C. ", "D. "][index];
                btn.innerText = prefixLabel + option;
                btn.onclick = () => checkAnswer(index);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const msg = document.getElementById("message");
            const buttons = document.querySelectorAll("#options-container button");
            buttons.forEach((b, i) => {
                b.disabled = true;
                if (i === currentQuestion.correct) {
                    b.style.backgroundColor = "#dcfce7";
                    b.style.borderColor = "#16a34a";
                    b.style.fontWeight = "bold";
                } else if (i === selectedIndex) {
                    b.style.backgroundColor = "#fee2e2";
                    b.style.borderColor = "#dc2626";
                }
            });

            if (selectedIndex === currentQuestion.correct) {
                correctCount++;
                msg.innerHTML = 'Chính xác! 🎉 <br><span style="font-size: 0.9rem; color: #555; font-weight: normal;">Giải thích: ' + currentQuestion.explanation + '</span>';
                msg.style.color = "green";
                
                wrongStreak = 0;
                correctStreak++;

                if (correctStreak >= 2) {
                    if (currentDifficulty === "easy") currentDifficulty = "medium";
                    else if (currentDifficulty === "medium") currentDifficulty = "hard";
                    correctStreak = 0;
                }
            } else {
                msg.innerHTML = 'Chưa chính xác! <br><span style="font-size: 0.9rem; color: #555; font-weight: normal;">Giải thích: ' + currentQuestion.explanation + '</span>';
                msg.style.color = "red";
                
                correctStreak = 0;
                wrongStreak++;

                if (wrongStreak >= 1) {
                    if (currentDifficulty === "hard") currentDifficulty = "medium";
                    else if (currentDifficulty === "medium") currentDifficulty = "easy";
                    wrongStreak = 0;
                }
            }

            setTimeout(() => {
                msg.innerText = "";
                loadQuestion();
            }, 3000);
        }

        function showFinalResult() {
            clearInterval(timerInterval);

            const finalScore = ((correctCount / maxQuestions) * 8).toFixed(1);
            let rating = "Đạt";
            if (finalScore >= 8.5) rating = "Giỏi (Xuất sắc)";
            else if (finalScore >= 7.0) rating = "Khá";
            else if (finalScore >= 5.0) rating = "Trung bình";
            else rating = "Cần cố gắng thêm";

            const now = new Date().toLocaleString("vi-VN");
            saveResultToLocal(studentName, studentClass, correctCount, maxQuestions, finalScore, rating, now);

            const container = document.getElementById("quiz-wrapper");
            container.innerHTML = '<div class="result-card">' +
                '<h3>🎉 HOÀN THÀNH BÀI KIỂM TRA!</h3>' +
                '<p>Học sinh: <b>' + studentName + '</b> - Lớp: <b>' + studentClass + '</b></p>' +
                '<hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 15px 0;">' +
                '<p style="font-size: 1.1rem;">Số câu trả lời đúng: ' + correctCount + ' / ' + maxQuestions + '</p>' +
                '<p style="font-size: 1.3rem; color: #4f46e5;">Điểm số của bạn: <b>' + finalScore + ' điểm</b></p>' +
                '<p>Đánh giá năng lực: <b>' + rating + '</b></p>' +
                '<div style="margin-top: 20px;">' +
                    '<button class="btn-action" onclick="exportScoresToExcel()">📥 Tải File Bảng Điểm Excel</button>' +
                    '<button class="btn-danger" style="margin-left: 5px;" onclick="clearHistory()">🗑️ Xóa lịch sử</button>' +
                    '<button class="btn-action" style="background-color: #6366f1; margin-left: 5px;" onclick="location.reload()">🔄 Làm bài mới</button>' +
                '</div>' +
            '</div>';
        }

        function saveResultToLocal(name, className, correct, total, score, rating, time) {
            let history = JSON.parse(localStorage.getItem("quiz_results") || "[]");
            history.push({ "Mã đề": CFG.examId, "Thời gian": time, "Họ và tên": name, "Lớp": className, "Số câu đúng": correct + "/" + total, "Điểm số": score, "Đánh giá": rating });
            localStorage.setItem("quiz_results", JSON.stringify(history));
        }

        function renderHistoryTable() {
            let history = JSON.parse(localStorage.getItem("quiz_results") || "[]");
            const wrapper = document.getElementById("history-table-wrapper");
            if (history.length === 0) {
                wrapper.innerHTML = '<p style="color: #888; font-style: italic; text-align: center; margin: 5px;">Chưa có kết quả làm bài nào.</p>';
                return;
            }
            let html = '<table><thead><tr><th>Thời gian</th><th>Họ tên</th><th>Lớp</th><th>Điểm</th><th>Xếp loại</th></tr></thead><tbody>';
            history.forEach(item => {
                html += '<tr><td>' + item["Thời gian"] + '</td><td><b>' + item["Họ và tên"] + '</b></td><td>' + item["Lớp"] + '</td><td style="color: #4f46e5; font-weight: bold;">' + item["Điểm số"] + '</td><td>' + item["Đánh giá"] + '</td></tr>';
            });
            html += '</tbody></table>';
            wrapper.innerHTML = html;
        }

        function exportScoresToExcel() {
            let history = JSON.parse(localStorage.getItem("quiz_results") || "[]");
            if (history.length === 0) { alert("Chưa có điểm số nào để tải!"); return; }
            const cleanData = history.map(({ ["Mã đề"]: _, ...rest }) => rest);
            const worksheet = XLSX.utils.json_to_sheet(cleanData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "BangDiem");
            XLSX.writeFile(workbook, "Bang_Diem_Trac_Nghiem.xlsx");
        }

        function clearHistory() {
            if (confirm("⚠️ Bạn có chắc chắn muốn xóa sạch toàn bộ lịch sử điểm số đã lưu trên máy này không?")) {
                localStorage.removeItem("quiz_results");
                renderHistoryTable();
                alert("✅ Đã xóa sạch lịch sử điểm thành công!");
            }
        }
    </script>
</body>
</html>
